[project]
name = "cti-agent"
version = "3.0.0"
description = "A Cyber Threat Intelligence Agent for SBOM analysis."
authors = [{ name = "Chad Zimmerman", email = "zimmermanc@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "pydantic-ai",
    "cyclonedx-python-lib",
    "pymongo",
    "python-dotenv",
    "xmltodict",
    "chromadb",
    "beautifulsoup4",
    "selenium",
    "webdriver-manager",
    "pypdf2",
    "googlesearch-python",
    "packageurl-python",
]

[project.scripts]
cti-agent = "cti_agent.main:cli_entrypoint"





